name: Build and Push MT5 Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/install.sh
      - scripts/start.sh
      - root/
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: docker.io/hieupth/mt5img

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t mt5img-build .

      - name: Run container to install MT5
        run: |
          docker run -d -e PUID=0 -e PGID=0 --name mt5-install mt5img-build /tmp/install.sh
          docker logs -f mt5-install &
          LOGS_PID=$!
          timeout 900 docker wait mt5-install
          EXIT_CODE=$?
          kill $LOGS_PID 2>/dev/null || true
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: MT5 installation timed out or failed"
            exit 1
          fi
          docker cp mt5-install:/config/.wine/drive_c/Program\ Files/MetaTrader\ 5/terminal64.exe /tmp/terminal64.exe
          echo "MT5 installation verified"

      - name: Commit and push image
        run: |
          docker commit --change 'CMD []' mt5-install ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest
          echo "Pushed ${{ env.IMAGE }}:latest"
